[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sa-bond-calculator"
version = "0.1.0"
description = "South African government bonds by the JSE Bond Pricing Formula, with bond forwards, futures and Black (1976) options"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ruan Goosen" }]
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
